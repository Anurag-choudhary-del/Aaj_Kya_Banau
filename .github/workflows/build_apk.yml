name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The original Dart files are stored in the repository root.
      # Copy them into the package paths their imports expect.
      # Do not replace the real models or recipe catalog with placeholders.
      - name: Prepare existing app sources
        shell: bash
        run: |
          set -euo pipefail

          flutter create . --project-name aaj_kya_banau --org com.aajkyabanau --platforms android

          mkdir -p lib/screens lib/state lib/theme lib/models lib/data test

          cp main.dart lib/main.dart
          cp main_shell.dart lib/screens/main_shell.dart
          cp home_screen.dart lib/screens/home_screen.dart
          cp recipes_screen.dart lib/screens/recipes_screen.dart
          cp planner_screen.dart lib/screens/planner_screen.dart
          cp cart_screen.dart lib/screens/cart_screen.dart
          cp scan_screen.dart lib/screens/scan_screen.dart

          cp kitchen_store.dart lib/state/kitchen_store.dart
          cp app_theme.dart lib/theme/app_theme.dart

          cp pantry_item.dart lib/models/pantry_item.dart
          cp grocery_item.dart lib/models/grocery_item.dart
          cp recipe.dart lib/models/recipe.dart
          cp kitchen_catalog.dart lib/data/kitchen_catalog.dart

          cp widget_test.dart test/widget_test.dart

      - name: Configure Android core library desugaring
        shell: bash
        run: |
          set -euo pipefail

          if [ -f android/app/build.gradle ]; then
            GRADLE_FILE="android/app/build.gradle"
          elif [ -f android/app/build.gradle.kts ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          else
            echo "Android app Gradle file not found."
            find android/app -maxdepth 2 -type f -print
            exit 1
          fi
          export GRADLE_FILE

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["GRADLE_FILE"])
          text = path.read_text()
          is_kts = path.suffix == ".kts"

          if is_kts:
              enable_line = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              enable_line = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if enable_line not in text:
              marker = "compileOptions {"
              if marker not in text:
                  raise SystemExit(f"Could not find compileOptions block in {path}")
              text = text.replace(marker, marker + "\n        " + enable_line, 1)

          if dependency not in text:
              marker = "dependencies {"
              if marker not in text:
                  raise SystemExit(f"Could not find dependencies block in {path}")
              text = text.replace(marker, marker + "\n    " + dependency, 1)

          path.write_text(text)
          print(f"Enabled core library desugaring in {path}")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aaj-kya-banau-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
