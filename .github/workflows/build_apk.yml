name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Preserve Custom Code & Auto-Fix Shorthands
        run: |
          # 1. Back up original custom screens
          cp -r lib lib_backup

          # 2. Re-create android configuration files
          flutter create . --project-name aaj_kya_banau --org com.aajkyabanau --platforms android

          # 3. Force restore custom screens over default files
          rm -rf lib
          cp -r lib_backup lib
          rm -rf lib_backup

          # 4. Auto-fix shorthand syntax
          find lib/ -name "*.dart" -type f -exec sed -i 's/\.fromSeed/ColorScheme.fromSeed/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/\.center/MainAxisAlignment.center/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/\.start/MainAxisAlignment.start/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/\.end/MainAxisAlignment.end/g' {} +
          
          flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aaj-kya-banau-apk
          path: build/app/outputs/flutter-apk/app-release.apk
