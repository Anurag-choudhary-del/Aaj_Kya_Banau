name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project Structure
        run: |
          mkdir temp_lib
          cp -r lib/* temp_lib/ 2>/dev/null || true
          flutter create . --project-name aaj_kya_banau --org com.aajkyabanau --platforms android
          cp -r temp_lib/* lib/ 2>/dev/null || true
          rm -rf temp_lib

      - name: Auto-Fix Dart Shorthand Errors in Code
        run: |
          find lib/ -name "*.dart" -type f -exec sed -i 's/\.fromSeed/ColorScheme.fromSeed/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/\.center/MainAxisAlignment.center/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/\.start/MainAxisAlignment.start/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/\.end/MainAxisAlignment.end/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/\.spaceAround/MainAxisAlignment.spaceAround/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/\.spaceBetween/MainAxisAlignment.spaceBetween/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/\.spaceEvenly/MainAxisAlignment.spaceEvenly/g' {} +
          flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aaj-kya-banau-apk
          path: build/app/outputs/flutter-apk/app-release.apk
