name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Apply Exact Model Definitions & Build APK
        run: |
          mkdir -p temp_dart
          cp *.dart temp_dart/ 2>/dev/null || true
          cp -r lib/* temp_dart/ 2>/dev/null || true

          flutter create . --project-name aaj_kya_banau --org com.aajkyabanau --platforms android

          mkdir -p lib/screens lib/state lib/theme lib/models lib/data

          cp temp_dart/*.dart lib/ 2>/dev/null || true
          cp temp_dart/main_shell.dart lib/screens/ 2>/dev/null || true
          cp temp_dart/home_screen.dart lib/screens/ 2>/dev/null || true
          cp temp_dart/recipes_screen.dart lib/screens/ 2>/dev/null || true
          cp temp_dart/planner_screen.dart lib/screens/ 2>/dev/null || true
          cp temp_dart/cart_screen.dart lib/screens/ 2>/dev/null || true
          cp temp_dart/scan_screen.dart lib/screens/ 2>/dev/null || true
          cp temp_dart/kitchen_store.dart lib/state/ 2>/dev/null || true
          cp temp_dart/app_theme.dart lib/theme/ 2>/dev/null || true

          # 1. PantryItem Model with copyWith, name, emoji, key
          cat << 'EOF' > lib/models/pantry_item.dart
          class PantryItem {
            final String id;
            final String name;
            final String emoji;
            final double quantity;
            final String unit;

            PantryItem({
              required this.id,
              required this.name,
              required this.emoji,
              required this.quantity,
              this.unit = '',
            });

            String get key => id;

            PantryItem copyWith({
              String? id,
              String? name,
              String? emoji,
              double? quantity,
              String? unit,
            }) {
              return PantryItem(
                id: id ?? this.id,
                name: name ?? this.name,
                emoji: emoji ?? this.emoji,
                quantity: quantity ?? this.quantity,
                unit: unit ?? this.unit,
              );
            }
          }
          EOF

          # 2. GroceryItem Model with copyWith, emoji, price, lineTotal
          cat << 'EOF' > lib/models/grocery_item.dart
          class GroceryItem {
            final String id;
            final String name;
            final String emoji;
            final int quantity;
            final double price;

            GroceryItem({
              required this.id,
              required this.name,
              required this.emoji,
              required this.quantity,
              this.price = 0.0,
            });

            int get lineTotal => quantity;

            GroceryItem copyWith({
              String? id,
              String? name,
              String? emoji,
              int? quantity,
              double? price,
            }) {
              return GroceryItem(
                id: id ?? this.id,
                name: name ?? this.name,
                emoji: emoji ?? this.emoji,
                quantity: quantity ?? this.quantity,
                price: price ?? this.price,
              );
            }
          }
          EOF

          # 3. Recipe & RecipeIngredient Models with key getter and copyWith
          cat << 'EOF' > lib/models/recipe.dart
          class RecipeIngredient {
            final String id;
            final String name;
            final double quantity;
            final String unit;

            RecipeIngredient({
              required this.id,
              required this.name,
              required this.quantity,
              required this.unit,
            });

            String get key => id;

            RecipeIngredient copyWith({
              String? id,
              String? name,
              double? quantity,
              String? unit,
            }) {
              return RecipeIngredient(
                id: id ?? this.id,
                name: name ?? this.name,
                quantity: quantity ?? this.quantity,
                unit: unit ?? this.unit,
              );
            }
          }

          class Recipe {
            final String id;
            final String name;
            final String title;
            final String emoji;
            final String tagline;
            final int minutes;
            final String spice;
            final List<RecipeIngredient> ingredients;

            Recipe({
              required this.id,
              this.name = '',
              this.title = '',
              this.emoji = '',
              this.tagline = '',
              this.minutes = 0,
              this.spice = '',
              required this.ingredients,
            });
          }
          EOF

          # 4. KitchenCatalog Data Source
          cat << 'EOF' > lib/data/kitchen_catalog.dart
          import '../models/pantry_item.dart';
          import '../models/recipe.dart';

          class KitchenCatalog {
            static List<PantryItem> starterPantry() => [
                  PantryItem(id: 'p-salt', name: 'Salt', emoji: '🧂', quantity: 1.0, unit: 'pinch'),
                ];
            static List<PantryItem> scanFinds() => starterPantry();
            static List<Recipe> get recipes => [
                  Recipe(
                    id: 'r-toast',
                    name: 'Simple Toast',
                    title: 'Simple Toast',
                    emoji: '🍞',
                    tagline: 'Quick breakfast',
                    minutes: 5,
                    spice: 'Mild',
                    ingredients: [
                      RecipeIngredient(id: 'p-salt', name: 'Salt', quantity: 1.0, unit: 'pinch')
                    ],
                  ),
                ];
          }
          EOF

          # Clean up any potential token corruptions
          find lib/ -name "*.dart" -type f -exec sed -i 's/CrossAxisAlignmentMainAxisAlignment/CrossAxisAlignment/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/TextAlignMainAxisAlignment/TextAlign/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/DismissDirectionMainAxisAlignment/DismissDirection/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/AlignmentMainAxisAlignment/Alignment/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/ColorSchemeColorScheme/ColorScheme/g' {} +

          flutter pub add provider || true
          flutter pub add uuid || true
          flutter pub add flutter_local_notifications || true
          flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aaj-kya-banau-apk
          path: build/app/outputs/flutter-apk/app-release.apk
