name: Build Flutter APK

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare existing app sources
        shell: bash
        run: |
          set -euo pipefail
          flutter create . --project-name aaj_kya_banau --org com.aajkyabanau --platforms android

          # Ensure release builds can reach the AI Worker over the internet.
          # flutter create may regenerate Android files, so enforce this on every build.
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in source:
              marker = "    <application"
              if marker not in source:
                  raise SystemExit("Could not find <application> in AndroidManifest.xml")
              source = source.replace(marker, permission + "\\n\\n" + marker, 1)
              manifest.write_text(source)
          if "android.permission.INTERNET" not in manifest.read_text():
              raise SystemExit("INTERNET permission was not added to AndroidManifest.xml")
          print("Verified Android INTERNET permission for release APK.")
          PY
          mkdir -p lib/screens lib/state lib/theme lib/models lib/data lib/services test
          cp main.dart lib/main.dart
          cp main_shell.dart lib/screens/main_shell.dart
          cp home_screen.dart lib/screens/home_screen.dart
          cp recipes_screen.dart lib/screens/recipes_screen.dart
          cp planner_screen.dart lib/screens/planner_screen.dart
          cp cart_screen.dart lib/screens/cart_screen.dart
          cp scan_screen.dart lib/screens/scan_screen.dart
          cp kitchen_store.dart lib/state/kitchen_store.dart
          cp app_theme.dart lib/theme/app_theme.dart
          cp pantry_item.dart lib/models/pantry_item.dart
          cp grocery_item.dart lib/models/grocery_item.dart
          cp recipe.dart lib/models/recipe.dart
          cp kitchen_catalog.dart lib/data/kitchen_catalog.dart
          cp planner_catalog.dart lib/data/planner_catalog.dart
          cp ingredient_recognition_service.dart lib/services/ingredient_recognition_service.dart
          cp widget_test.dart test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app and tests
        run: flutter analyze --no-fatal-infos lib test

      - name: Run widget tests
        run: flutter test

      - name: Build release APK
        env:
          AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL || 'https://aaj-kya-banau-ai.anuragchoudhary7816.workers.dev' }}
        run: flutter build apk --release --no-tree-shake-icons --dart-define=AI_API_BASE_URL="$AI_API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aaj-kya-banau-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
